# Build the image on a GitHub runner and hand Fly a finished artefact.
#
# NOT YET EXERCISED — there is no GitHub remote for this repo at the time of
# writing, so this file has never run. Treat the first run as a debugging
# session, and prefer `fly deploy --remote-only` from a laptop until it goes
# green once.
#
# Requires one repository secret: FLY_API_TOKEN (`fly tokens create deploy`).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Cache lives in GHCR; the image itself goes to Fly's registry, which
      # flyctl authenticates against without extra credentials.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate Docker against Fly's registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.fly.io/quiz-servant:${{ github.sha }}
          # Registry-backed rather than type=gha on purpose: GitHub's action
          # cache evicts entries after 7 days without access, which is exactly
          # a teaching cadence — you would hit the full ~18 minute dependency
          # rebuild precisely in the weeks you deploy least.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Deploy
        run: flyctl deploy --image registry.fly.io/quiz-servant:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
