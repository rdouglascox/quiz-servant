quiz: ethics-week3
title: "Week 3 — Consequentialism"
feedback: after_close

questions:
  - key: trolley
    type: choice
    prompt: "A runaway tram will kill five people. You can divert it onto a track where it will kill one. Do you pull the lever?"
    options:
      - { key: pull, text: "Pull the lever" }
      - { key: refrain, text: "Do nothing" }
      - { key: unsure, text: "I don't know" }

  - key: which-consequentialist
    type: multi
    prompt: "Which of these claims are consequentialist?"
    select: 1..3
    correct: [outcomes, aggregate]
    options:
      - { key: outcomes, text: "An act is right if it produces the best outcome" }
      - { key: duty, text: "Some acts are wrong whatever their effects" }
      - { key: aggregate, text: "We should maximise total welfare across everyone" }
      - { key: virtue, text: "The right act is what a virtuous person would do" }

  - key: define-utility
    type: text
    prompt: "In one sentence, what does 'utility' mean in this context?"
    max_length: 200

  - key: confidence
    type: scale
    prompt: "How confident are you that you could defend your answer to Q1?"
    range: 1..5
    labels:
      1: "Not at all"
      3: "Somewhat"
      5: "Very"

  - key: how-compelling
    type: grid
    prompt: "How compelling do you find each of these objections to utilitarianism?"
    range: 1..5
    labels:
      1: "Not at all"
      5: "Very"
    items:
      - { key: demandingness, text: "It asks too much of ordinary people" }
      - { key: integrity, text: "It can require you to betray your own commitments" }
      - { key: measurement, text: "Welfare cannot really be added up" }
      - { key: rights, text: "It permits sacrificing an innocent for the greater good" }
