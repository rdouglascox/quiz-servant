<!--
  quiz-servant · deck-side embed

  Include once per deck, after the body:

      pandoc talk.md --template=minpressive_basic.html \
             --include-after-body=tools/quiz-embed.html \
             -o talk.html

  Point it at your server and quiz in the deck's metadata block, with two meta
  tags — written below without their angle brackets so that a copy of this
  comment cannot be mistaken for the real configuration:

      ---
      title: "Week 3 — Consequentialism"
      header-includes: |
        meta name="quiz-base" content="https://quiz-servant.fly.dev"
        meta name="quiz-slug" content="ethics-week3"
      ---

  (see slides/ethics-week3.md for the real thing)

  Then drop a panel wherever you want results, using the question's key from
  the YAML. The placeholder row matters: it is what shows before the first
  fetch, what shows if JavaScript never runs, and — in minpressive — what gives
  the table enough height to be recognised as a step at all.

  This is illustration only, not a template the script clones — pandoc emits
  this whole comment verbatim into every deck's built HTML, so the example key
  below is deliberately not a plausible real one (unlike "trolley", which is
  the running example elsewhere in this project and could genuinely collide
  with a course's own question):

      <table data-quiz="your-question-key"><tbody>
        <tr><td>Waiting for responses…</td></tr>
      </tbody></table>

  Nothing here is required. The server sends structure and numbers; the styling
  below is a starting point to edit or delete.
-->

<style>
  /* The bar is drawn on the option cell from the --pct the server sets.

     currentColor is doing something specific here. minpressive hides an
     un-revealed block by setting `color: rgba(0,0,0,0)`, so a bar painted in
     currentColor is invisible until its step is revealed, then fades in with
     the rest of the block. Painting it in a literal colour would leave the
     results visible on screen before you reached them, spoiling the build.

     Mixing toward transparent keeps the label readable over the fill, and
     inherits whatever ink the deck uses — so this works in light and dark
     without knowing which it is. */
  /* Full measure, or the bars are squeezed into a shrink-to-fit table.
     `display: table` is not redundant: minpressive sets `display: block` on
     every table (to let wide ones scroll horizontally), which takes the
     element out of table layout — the element gets the width, but the
     anonymous table box generated inside it sizes to content, so cells
     collapse and neither `width: 100%` nor `colspan` on a cell does
     anything. The tallies only looked right because their text happens to
     fill the measure; the join panel, with one short row, gave it away. */
  [data-quiz] { width: 100%; display: table; }

  /* ---------------------------------------------------------------------
     We own this component's chrome.

     A panel is authored as ::: {.quiz question=…} and its markup is emitted
     by tools/quiz-filter.lua, so there is no reason to inherit the deck's
     table styling wholesale. minpressive rules every <table> above and below
     the <tbody> in ink — reasonable for a data table, wrong for a tally,
     which is a picture of a distribution rather than a grid of values. The
     bars already carry the structure; the rules only box them in.

     `!important` rather than relying on source order: these selectors tie on
     specificity with minpressive's own `table.highlight tbody`, so they would
     otherwise win only by virtue of this stylesheet being included after the
     body. That is a silent trap the day the include moves.
     --------------------------------------------------------------------- */
  [data-quiz],
  [data-quiz] tbody,
  [data-quiz] tr,
  [data-quiz] th,
  [data-quiz] td {
    border: 0 !important;
  }

  /* Restates the question on the panel itself, so reading the slide never
     depends on the deck author having written matching text nearby — see
     Quiz.Server.Html.embedFragment. A heading, not a result, so it gets its
     own row rather than sharing the option/count column layout below it. */
  [data-quiz] .quiz-prompt > td {
    width: 100%;
    font-weight: 700;
    padding-bottom: .35em;
  }

  /* A grid's bars are a position on its own scale, not a share of a total —
     unreadable without knowing what the endpoints mean. Dimmed like the
     rejoin line: it is context for the row below it, not a result itself. */
  [data-quiz] .quiz-grid-legend > td {
    width: 100%;
    opacity: .7;
    font-size: .85em;
    padding-bottom: .35em;
  }

  [data-quiz] .quiz-option {
    background-image: linear-gradient(to right,
      color-mix(in srgb, currentColor 18%, transparent) 0 calc(var(--pct, 0) * 1%),
      transparent 0);
    background-repeat: no-repeat;
    padding-right: 1em;
    /* Take all the space the count column does not, so a bar's length is a
       share of the full measure rather than of however wide the longest
       option happens to be. */
    width: 100%;
  }

  [data-quiz] .quiz-count { text-align: right; font-variant-numeric: tabular-nums; }

  /* The join panel: code centred, address beneath it as the caption. Sized in
     em so it tracks the deck's fluid type rather than pinning to a pixel size
     — minpressive scales everything from one clamp() on the root font, and a
     QR that ignored that would be conspicuous on a projector.

     `width: 100%` on the cells is doing real work. These rows are colspan=2,
     but colspan alone does not make a cell span the measure: with the table's
     automatic layout and no other rows to establish column widths, the join
     panel's columns collapse to their content, and the "centred" QR ends up
     centred inside a narrow box hugging the left margin. Claiming the full
     width gives the centring something to centre against. */
  [data-quiz] .quiz-qr-row > td,
  [data-quiz] .quiz-join > td {
    width: 100%;
    text-align: center;
  }
  [data-quiz] .quiz-qr-row > td { padding-bottom: .25em; }
  [data-quiz] .quiz-qr svg { display: block; width: 7em; height: auto; margin: 0 auto; }

  /* Bold alone reads as noise at a distance — this is a lecture theatre, not
     a document. A darker fill gives the correct row a second, independent
     signal, using the same currentColor tint the bar is already built from
     rather than introducing an accent colour minpressive itself never uses. */
  [data-quiz] .is-correct .quiz-option {
    font-weight: 700;
    background-image: linear-gradient(to right,
      color-mix(in srgb, currentColor 38%, transparent) 0 calc(var(--pct, 0) * 1%),
      transparent 0);
  }

  /* A free-text answer is, structurally, a quotation — so it gets minpressive's
     own device for one: a left rule. currentColor-relative rather than
     minpressive's literal #e6e6e6, so this still reads correctly if a deck
     ever uses a template with a different palette.

     The class lives on the <tr> (see Quiz.Server.Html.embedFragment), but the
     border is set on the child <td>: a border-left on a table-row is not
     reliably rendered under the default (non-collapsed) table border model
     that minpressive uses, whereas a table-cell border always is. */
  [data-quiz] .quiz-text { font-style: italic; }
  [data-quiz] .quiz-text > td {
    /* Wins back over the blanket `border: 0` reset above: same `!important`,
       but one class more specific, so this is the deliberate exception rather
       than a fight with source order. */
    border-left: 2px solid color-mix(in srgb, currentColor 25%, transparent) !important;
    padding-left: .75em;
  }

  /* A rejoin line closes every results panel, in case a student lost their
     page mid-lecture and needs the address off whatever slide is currently
     up — see Quiz.Server.Html.embedFragment. Dimmed and small so it reads as
     a fallback, not as part of the result being presented. */
  [data-quiz] .quiz-rejoin > td {
    width: 100%;
    text-align: center;
    opacity: .6;
    font-size: .8em;
    padding-top: .6em;
  }
</style>

<script>
'use strict';

// Deferred scripts — including minpressive's runtime — have all executed by
// the time DOMContentLoaded fires, so the reveal classes we look for below
// already exist. Running earlier would see a page that has not been wired up.
document.addEventListener('DOMContentLoaded', function () {

  function meta(name) {
    var el = document.querySelector('meta[name="' + name + '"]');
    return el ? el.content.trim() : '';
  }

  var base = meta('quiz-base').replace(/\/+$/, '');
  var slug = meta('quiz-slug');
  var every = parseInt(meta('quiz-interval') || '2000', 10);
  if (!base || !slug) return;          // not a quiz deck; leave placeholders alone

  document.querySelectorAll('[data-quiz]').forEach(function (panel) {
    var question = panel.getAttribute('data-quiz');
    // Rows replace a <tbody>, not the <table>: replacing the table's own
    // innerHTML would work, but the element must survive untouched because
    // minpressive captured it as a step at load time.
    var target = panel.tBodies && panel.tBodies.length ? panel.tBodies[0] : panel;
    var url = base + '/embed/' + encodeURIComponent(slug)
                   + '/' + encodeURIComponent(question) + '/frag';
    var timer = null;

    // Whatever the deck author wrote in the panel, kept so it can be put back.
    // A free-text question with no approved answers returns an empty fragment,
    // and an empty <tbody> collapses the table to nothing — the panel would
    // vanish as you revealed it. Restoring the placeholder rather than simply
    // declining to overwrite matters: declining would leave the last approved
    // answers on screen after you hid them again.
    var placeholder = target.innerHTML;

    function refresh() {
      fetch(url, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : null; })
        .then(function (html) {
          if (html === null) return;
          var next = html.trim() === '' ? placeholder : html;
          // Only touch the DOM when something changed, so bars are not
          // rebuilt — and CSS transitions not restarted — twice a second.
          if (next !== target.innerHTML) target.innerHTML = next;
        })
        .catch(function () { /* a dropped poll is not worth reporting mid-lecture */ });
    }

    function start() { if (!timer) { refresh(); timer = setInterval(refresh, every); } }
    function stop()  { if (timer) { clearInterval(timer); timer = null; } }

    // In a reveal-based deck, poll only while the panel is actually revealed:
    // no traffic until you reach the question, and none once you have moved
    // past it. In an ordinary page there is nothing to wait for, so poll from
    // the start.
    if (document.querySelector('.highlightable')) {
      new MutationObserver(function () {
        panel.classList.contains('highlight') ? start() : stop();
      }).observe(panel, { attributes: true, attributeFilter: ['class'] });
      if (panel.classList.contains('highlight')) start();
    } else {
      start();
    }
  });
});
</script>
